services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: kstolu
      POSTGRES_USER: kstolu
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kstolu -d kstolu"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
