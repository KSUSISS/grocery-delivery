<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Отчеты — КСтолу</title><link rel="stylesheet" href="/orders.css"></head>
<body class="desk"><aside th:replace="~{desk-nav :: menu}"></aside><main>
<h1>Отчеты по курьерам</h1>
<form class="search" th:action="@{/orders/reports}" method="get">
  <label>С<input type="date" name="from" required th:value="${from}"></label>
  <label>По<input type="date" name="to" required th:value="${to}"></label>
  <button>Показать</button>
</form>
<p class="message" role="alert" th:if="${error}" th:text="${error}"></p>
<section class="panel">
<p>Пробег включает введенные метры доставки и рассчитанный путь обратно до кафе. Ставка — 10 ₽/км.</p>
<div class="table-wrap"><table>
<thead><tr><th scope="col">Курьер</th><th scope="col">Доставлено</th><th scope="col">С пробегом</th><th scope="col">Общий пробег, км</th><th scope="col">Начислено, ₽</th></tr></thead>
<tbody>
<tr th:each="r : ${report}">
  <th scope="row" th:text="${r.name}"></th>
  <td th:text="${r.delivered}"></td>
  <td th:text="${r.measured}"></td>
  <td th:text="${r.measured + r.returns == 0 ? '—' : #numbers.formatDecimal(r.meters / 1000.0, 1, 3)}"></td>
  <td th:text="${r.measured + r.returns == 0 ? '—' : #numbers.formatDecimal(r.meters / 100.0, 1, 2)}"></td>
</tr>
</tbody></table></div>
<p th:if="${report.isEmpty()}">Нет данных для отчета.</p>
</section>
</main></body></html>
